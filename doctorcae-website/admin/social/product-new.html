<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — New product</title>
  <link rel="stylesheet" href="/admin/admin.css" />
  <style>
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--admin-muted); margin-bottom: 0.35rem; }
    .field input, .field textarea, .field select {
      width: 100%; max-width: 40rem; padding: 0.6rem 0.75rem; font-size: 0.95rem; border: 1px solid var(--admin-border);
      border-radius: 0.5rem; font-family: inherit; box-sizing: border-box;
    }
    .field textarea { min-height: 100px; }
    .field-hint { font-size: 0.78rem; color: var(--admin-muted); margin-top: 0.25rem; }
    .img-preview { max-width: 200px; max-height: 200px; border-radius: 0.5rem; border: 1px solid var(--admin-border); margin-top: 0.5rem; display: none; }
    .img-preview.is-on { display: block; }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1rem; }
    .btn-primary {
      padding: 0.65rem 1.25rem; border: none; border-radius: 999px; font-weight: 600; cursor: pointer;
      background: linear-gradient(135deg, var(--admin-blue), var(--admin-clay)); color: #fff; font-size: 0.95rem;
    }
    .btn-secondary { padding: 0.65rem 1rem; border-radius: 999px; border: 1px solid var(--admin-border); background: #fff; cursor: pointer; font-family: inherit; text-decoration: none; color: inherit; display: inline-block; line-height: 1.2; }
  </style>
</head>
<body class="admin-body">
  <div id="admin-gate">Checking session…</div>
  <div id="admin-shell" class="admin-shell admin-hidden">
    <header class="admin-top">
      <a class="admin-brand" href="/admin/">Admin <span>· Dr. Cae Soma</span></a>
      <nav class="admin-nav" id="admin-nav"></nav>
      <button type="button" class="btn-ghost" id="admin-logout">Sign out</button>
    </header>

    <h1 class="admin-page-title">New product</h1>
    <p class="admin-page-lede"><a href="/admin/social/index.html">← Back to Social content</a></p>

    <form id="f" class="admin-card">
      <div class="field"><label for="title">Title</label><input id="title" name="title" type="text" required placeholder="e.g. Body First Framework Guide" /></div>
      <div class="field"><label for="category">Category</label><input id="category" name="category" type="text" placeholder="e.g. Guide, Course, Consultation" /></div>
      <div class="field"><label for="shortDescription">Short description</label><textarea id="shortDescription" name="shortDescription" placeholder="One or two sentences for social copy."></textarea></div>
      <div class="field"><label for="price">Price</label><input id="price" name="price" type="text" placeholder="e.g. $49, Free, $199" /></div>
      <div class="field"><label for="callToAction">Call to action</label><input id="callToAction" name="callToAction" type="text" placeholder="e.g. Get the guide, Enroll now" /></div>
      <div class="field"><label for="productUrl">Product URL</label><input id="productUrl" name="productUrl" type="url" placeholder="https://…" /></div>
      <div class="field"><label for="status">Status</label>
        <select id="status" name="status"><option value="draft">Draft</option><option value="active">Active</option></select>
      </div>
      <div class="field"><label for="imageUrl">Image URL (optional)</label><input id="imageUrl" name="imageUrl" type="url" placeholder="https://… link to an image" />
        <p class="field-hint">Use a hosted image link, or upload below — not both required.</p>
      </div>
      <div class="field">
        <label for="imageFile">Upload image (optional)</label>
        <input id="imageFile" name="imageFile" type="file" accept="image/*" />
        <p class="field-hint">Small images only (about under 400KB). For larger files, upload elsewhere and paste the URL above.</p>
        <img id="imgPreview" class="img-preview" alt="Preview" />
      </div>
      <p id="err" class="admin-note admin-hidden" style="color: #b42318;"></p>
      <div class="actions">
        <button type="submit" class="btn-primary" id="save">Save product</button>
        <a href="/admin/social/index.html" class="btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
  <script src="/admin/admin-auth.js"></script>
  <script>
    var imageDataUrl = '';

    document.getElementById('imageUrl').addEventListener('input', function () {
      if (this.value.trim()) {
        document.getElementById('imageFile').value = '';
        imageDataUrl = '';
        var prev = document.getElementById('imgPreview');
        prev.classList.remove('is-on');
        prev.removeAttribute('src');
      }
    });

    document.getElementById('imageFile').addEventListener('change', function () {
      var f = this.files && this.files[0];
      var err = document.getElementById('err');
      err.classList.add('admin-hidden');
      imageDataUrl = '';
      var prev = document.getElementById('imgPreview');
      prev.classList.remove('is-on');
      if (!f) return;
      if (f.size > 480 * 1024) {
        err.textContent = 'File is too large. Use a smaller image or paste an image URL instead.';
        err.classList.remove('admin-hidden');
        this.value = '';
        return;
      }
      var r = new FileReader();
      r.onload = function () {
        var result = r.result;
        if (typeof result === 'string' && result.length > 450000) {
          err.textContent = 'Image is too large after encoding. Use an image URL instead.';
          err.classList.remove('admin-hidden');
          document.getElementById('imageFile').value = '';
          return;
        }
        imageDataUrl = result;
        document.getElementById('imageUrl').value = '';
        prev.src = result;
        prev.classList.add('is-on');
      };
      r.readAsDataURL(f);
    });

    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var err = document.getElementById('err');
      err.classList.add('admin-hidden');
      var payload = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        shortDescription: document.getElementById('shortDescription').value,
        price: document.getElementById('price').value,
        callToAction: document.getElementById('callToAction').value,
        productUrl: document.getElementById('productUrl').value,
        status: document.getElementById('status').value,
        imageUrl: document.getElementById('imageUrl').value,
        imageDataUrl: imageDataUrl || undefined,
      };
      document.getElementById('save').disabled = true;
      fetch('/api/social-products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(payload),
      })
        .then(function (r) {
          return r.json().then(function (j) {
            return { ok: r.ok, j: j };
          });
        })
        .then(function (x) {
          if (x.ok && x.j.product) {
            window.location.href = '/admin/social/product-edit.html?id=' + encodeURIComponent(x.j.product.id);
            return;
          }
          err.textContent = (x.j && x.j.error) || 'Save failed';
          err.classList.remove('admin-hidden');
        })
        .finally(function () {
          document.getElementById('save').disabled = false;
        });
    });
    AdminAuth.init({ active: 'social' });
  </script>
</body>
</html>
